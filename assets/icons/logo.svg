<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C7EEF"/>
      <stop offset="100%" stop-color="#6052E4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Modern shape with gradient background -->
  <rect width="200" height="200" rx="40" fill="url(#logoGradient)" filter="url(#shadow)"/>
  
  <!-- Abstract geometric patterns -->
  <path d="M40 100 C40 60, 100 30, 160 100 C160 140, 100 170, 40 100 Z" 
        fill="white" fill-opacity="0.15" />
  <path d="M60 100 C60 70, 100 50, 140 100 C140 130, 100 150, 60 100 Z" 
        fill="white" fill-opacity="0.2" />
  
  <!-- Primary icon shape -->
  <path d="M80 70 L130 70 L150 120 L100 150 L50 120 L70 70 Z" 
        fill="white" filter="url(#shadow)"/>
  
  <!-- Center accent element -->
  <circle cx="100" cy="100" r="20" fill="#6052E4"/>
  <circle cx="100" cy="100" r="10" fill="white" fill-opacity="0.6"/>
  
  <!-- Decorative elements -->
  <circle cx="150" cy="50" r="8" fill="white" fill-opacity="0.8"/>
  <circle cx="50" cy="150" r="8" fill="white" fill-opacity="0.8"/>
  <circle cx="160" cy="140" r="5" fill="white" fill-opacity="0.6"/>
  <circle cx="40" cy="60" r="5" fill="white" fill-opacity="0.6"/>
</svg> 